[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexa-productivity-hub"
version = "1.0.0"
description = "NEXA Productivity Hub — plataforma interna de productividad"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary — NEXA Internal Use Only"}
authors = [
    {name = "NEXA", email = "fabian@nexa.com"}
]

dependencies = [
    "PySide6>=6.8,<6.10",
    "openpyxl>=3.1",
    "pywin32>=306",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
nexa-hub = "hub.app:main"

[tool.setuptools.packages.find]
include = ["hub*", "modules*"]

[tool.setuptools.package-data]
"*" = ["plugin.json", "*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: integration tests",
]
